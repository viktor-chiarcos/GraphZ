[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphz"
version = "0.1.0"
description = "Linux-native GraphZ replacement: .gphz editor, Arduino C++ codegen and upload"
readme = "HANDOVER.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.2"]

[project.scripts]
graphz = "graphz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
