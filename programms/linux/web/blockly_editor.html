<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphZ Blockly Editor</title>
  <link rel="icon" href="data:,">
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="brand">
        <span class="brand-mark">G</span>
        <span>GraphZ Blockly Editor</span>
      </div>
      <div class="controls">
        <label>Kit
          <select id="kit"></select>
        </label>
        <label>Circuit
          <select id="circuit"></select>
        </label>
        <label>Mode
          <select id="mode"></select>
        </label>
        <span class="divider"></span>
        <button id="newButton" class="secondary">New</button>
        <button id="importButton" class="secondary">Import .gphz</button>
        <button id="exportButton" class="secondary">Export .gphz</button>
        <button id="matrixButton" class="secondary">Edit matrix</button>
        <button id="generateButton" class="primary">Generate C++</button>
        <input id="fileInput" type="file" accept=".gphz,application/json" hidden>
      </div>
    </header>

    <main>
      <section id="blockly" aria-label="Blockly workspace"></section>
      <aside class="preview-pane">
        <div class="pane-header">
          <span>C++ preview</span>
          <span class="hint">Live, kit-specific</span>
        </div>
        <pre id="preview"></pre>
        <div id="status" class="status" data-kind="info">Ready.</div>
      </aside>
    </main>
  </div>

  <div id="matrixModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="matrixTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="matrixTitle">Edit 8x8 matrix</h2>
        <p>Choose a colour for each pixel. Row 1 starts at the top-left.</p>
      </div>
      <div id="matrixGrid" class="matrix-grid"></div>
      <div class="modal-actions">
        <button id="matrixClear" class="secondary">Clear</button>
        <button id="matrixCancel" class="secondary">Cancel</button>
        <button id="matrixSave" class="primary">Save matrix</button>
      </div>
    </div>
  </div>
</body>
</html>
